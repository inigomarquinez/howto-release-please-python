name: Create or update release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      output: ${{ toJSON(steps.release.outputs) }}
    steps:
      - name: 🆕 Create or update release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🖨️ Print release output
        env:
          RELEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
        run: |
          echo "$RELEASE_OUTPUT"

  # Placeholder for post-release work (build and push an image, deploy, notify, ...).
  # It only runs when release-please actually created a release, i.e. when a release
  # PR was merged into main.
  post-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Post-release hook
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          echo "Release $TAG_NAME (version $VERSION) was created."
          echo "Run your build/deploy/notify steps here."
